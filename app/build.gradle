plugins {
    id 'com.android.application'
}

android {
    namespace 'nl.bromroute.app'
    compileSdk 35

    defaultConfig {
        applicationId 'nl.bromroute.app'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
